name: Validate — Python terrain
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test dependency-free terrain specification
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile provisional adapter (without importing Box2D)
        run: python -m py_compile src/robust_bipedal/custom_bipedal_env.py
